name: Bug report
description: Report a bug in torch-dfo
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A minimal self-contained code snippet that reproduces the bug.
      render: python
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: input
    id: torch_dfo_version
    attributes:
      label: torch-dfo version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: torch_version
    attributes:
      label: PyTorch version
      placeholder: e.g. 2.4.0+cu121
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g. CUDA (A4500), CPU, MPS (M2)
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python version
      placeholder: e.g. 3.11.9
    validations:
      required: true
