name: Docs

on:
  pull_request:
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"
      - ".readthedocs.yaml"
      - "pyproject.toml"
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "examples/**"
      - "src/**"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU-only PyTorch
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and docs extras
        run: pip install -e ".[docs]"

      - name: Build docs
        run: sphinx-build -W --keep-going -b html docs _build/html
