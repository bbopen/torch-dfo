name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4.0"
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check src/ tests/ examples/

      - name: Ruff lint
        run: ruff check src/ tests/ examples/

      - name: mypy
        run: mypy src/

      - name: Release metadata check
        run: pytest tests/test_release_metadata.py -q -o "addopts="

  cpu-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4.0"
          pip install -e .

      - name: CPU import and API smoke
        run: |
          python - <<'PY'
          import importlib.metadata as metadata
          import torch
          from torch_dfo import (
              CMAES,
              Categorical,
              DFOOptimizer,
              DLRPortfolio,
              Float,
              Int,
              NelderMead,
              PhasedDFO,
              SHADE,
              SearchSpace,
              __version__,
          )

          assert metadata.version("torch-dfo") == __version__
          _ = (SHADE, NelderMead, PhasedDFO, DLRPortfolio, DFOOptimizer)
          _ = SearchSpace([Float("x", -1.0, 1.0), Int("n", 0, 2), Categorical("c", ["a", "b"])])
          opt = CMAES(dim=2, bounds=1.0, pop_size=4, seed=1, device="cpu")
          x = opt.ask()
          opt.tell(x, (x**2).sum(-1))
          _best_x, best_f = opt.best()
          assert torch.isfinite(best_f)
          print("cpu smoke ok", __version__)
          PY

  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package and docs extras
        run: pip install -e ".[docs]"

      - name: Build docs
        run: sphinx-build -W --keep-going -b html docs _build/html

  gpu-tests:
    # Runs on a self-hosted CUDA runner (RunPod A4500). CUDA correctness is a
    # required signal for every workflow run; runner availability is part of
    # the release contract.
    runs-on: [self-hosted, cuda]
    environment: gpu-runner
    timeout-minutes: 30
    env:
      CUDA_VENV: /workspace/torch-dfo/.venv
    steps:
      - uses: actions/checkout@v4

      - name: Validate CUDA runner environment
        run: |
          test -x "${CUDA_VENV}/bin/python"
          test -x "${CUDA_VENV}/bin/pip"
          test -x "${CUDA_VENV}/bin/ruff"
          test -x "${CUDA_VENV}/bin/pytest"

      - name: Report device
        run: |
          echo "== nvidia-smi =="
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true
          echo "== python / torch =="
          python3 --version
          "${CUDA_VENV}/bin/python" -c "import torch; print(f'torch={torch.__version__} cuda={torch.cuda.is_available()} device={torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"n/a\"}')"

      - name: Install the checked-out source into the pod venv
        run: |
          "${CUDA_VENV}/bin/pip" install -e . --no-deps --quiet

      - name: Ruff lint
        run: |
          "${CUDA_VENV}/bin/ruff" check src/ tests/

      - name: Pytest (CUDA device fixture will activate automatically)
        run: |
          "${CUDA_VENV}/bin/pytest" tests/ -q --maxfail=5

  build-dist:
    runs-on: ubuntu-latest
    needs: [static-checks, cpu-smoke, build-docs, gpu-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check dist metadata
        run: twine check dist/*

      - name: Show built artifacts
        run: ls -lh dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
