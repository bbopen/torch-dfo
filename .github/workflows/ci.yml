name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (CPU-only torch to keep CI fast)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.4.0"
          pip install -e ".[dev]"

      - name: Ruff format check
        run: ruff format --check src/ tests/ examples/

      - name: Ruff lint
        run: ruff check src/ tests/ examples/

      - name: mypy
        run: mypy src/

      - name: Pytest
        run: pytest tests/ -q --maxfail=5

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

  gpu-tests:
    # Runs on a self-hosted CUDA runner (RunPod A4500). Runs on every
    # push / PR / dispatch so CUDA correctness is part of every merge
    # gate. `continue-on-error: true` keeps the pipeline unblocked if
    # the pod is offline — the CPU lane remains authoritative then.
    # `timeout-minutes: 30` bounds queued jobs when the pod is down.
    runs-on: [self-hosted, cuda]
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Report device
        run: |
          echo "== nvidia-smi =="
          nvidia-smi --query-gpu=name,memory.total,driver_version --format=csv,noheader || true
          echo "== python / torch =="
          python3 --version
          /workspace/torch-dfo/.venv/bin/python -c "import torch; print(f'torch={torch.__version__} cuda={torch.cuda.is_available()} device={torch.cuda.get_device_name(0) if torch.cuda.is_available() else \"n/a\"}')"

      - name: Install the checked-out source into the pod venv
        run: |
          /workspace/torch-dfo/.venv/bin/pip install -e . --no-deps --quiet

      - name: Ruff lint
        run: /workspace/torch-dfo/.venv/bin/ruff check src/ tests/

      - name: Pytest (CUDA device fixture will activate automatically)
        run: /workspace/torch-dfo/.venv/bin/pytest tests/ -q --maxfail=5

  build-dist:
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build

      - name: Check dist metadata
        run: twine check dist/*

      - name: Show built artifacts
        run: ls -lh dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
